<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hack Club Wheaton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://server.fillout.com/embed/v1/"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cvs"></canvas>

<nav id="nav">
  <a href="https://hackclub.com/" target="_blank" rel="noopener">
    <img class="n-flag" src="https://assets.hackclub.com/flag-orpheus-top.svg" alt="Hack Club" height="36" onerror="this.src='https://assets.hackclub.com/flag-orpheus-left.svg';this.onerror=null">
  </a>
  <div class="n-div"></div>
  <a class="n-name" href="#">Hack Club <small>Wheaton International School</small></a>
  <div class="n-sp"></div>
  <div class="n-links">
    <a href="#about">About</a>
    <a href="#team">Team</a>
    <a href="#school">School</a>
    <a href="#faq">FAQ</a>
    <a href="#contact">Find Us</a>
    <a href="#apply" class="n-cta">Apply Now</a>
  </div>
</nav>

<section class="hero">
  <div class="hero-aura"></div>
  <div class="wrap hero-wrap">
    <div>
      <div class="hero-pill"><div class="pulse"></div>Bagdogra, WB &nbsp;&middot;&nbsp; Active Club</div>
      <h1 class="hero-h1">Hack Club<em>Wheaton.</em></h1>
      <p class="hero-sub">WIS finally has a coding club. We show up, build stuff, and ship it. No grades involved.</p>
      <div class="btn-row">
        <a href="#apply" class="btn btn-red">Apply to join</a>
        <a href="#about" class="btn btn-ghost">Learn more</a>
      </div>
    </div>
    <div class="photo-card">
      <img src="https://cdn.hackclub.com/019d051f-91e4-7ffc-a398-bc9d6efd35ff/1000003042.jpg" alt="Wheaton International School" loading="eager">
      <div class="photo-ov"></div>
      <div class="photo-foot">
        <div class="photo-logo"><img src="https://cdn.hackclub.com/019d051f-93f9-7561-8323-c35c1e595784/1000003041.jpg" alt="WIS"></div>
        <div class="photo-txt">Wheaton International School <span>Bagdogra, West Bengal</span></div>
      </div>
    </div>
  </div>
</section>

<div class="marquee" aria-hidden="true">
  <div class="m-inner">
  </div>
</div>
</body>
</html>
